name: Portal e2e

on:
  push:
  pull_request:

concurrency:
  group: portal-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-e2e:
    name: Seed beta org and run all portal e2es
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Required: a Neon (or Neon-compatible WebSocket) Postgres URL dedicated
      # to CI. The app uses @neondatabase/serverless, which talks to Neon over
      # WebSockets, so a plain `postgres://` from a generic CI Postgres service
      # will not work. Provision a throwaway Neon branch for CI and put its
      # connection string in the `CI_DATABASE_URL` repo secret.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      SESSION_SECRET: ci-portal-e2e-session-secret
      REPL_ID: ci-portal-e2e
      REPLIT_DOMAINS: localhost:5000
      ISSUER_URL: https://replit.com/oidc
      # Use production mode so the server skips createViteServer() entirely.
      # In development mode, server.listen() is not called until after
      # createViteServer() resolves, which can take 60-120 s on a cold CI
      # runner (no Vite cache) and has a process.exit(1) on any Vite error.
      # Production mode calls server.listen() in seconds with no Vite involved.
      NODE_ENV: production
      BASE_URL: http://localhost:5000
      PORTAL_EMAIL: client@beta.hubify.test
      PORTAL_PASSWORD: HubifyBeta!2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CI_DATABASE_URL secret is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::CI_DATABASE_URL secret is not set."
            echo "Add a Neon test-branch connection string under repo Settings"
            echo "→ Secrets and variables → Actions → New repository secret"
            echo "with name CI_DATABASE_URL."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Push database schema
        run: npx drizzle-kit push --force

      # Build the frontend + bundle the server. Required for NODE_ENV=production
      # (serveStatic() throws if dist/public is missing).
      - name: Build app
        run: npm run build

      - name: Start server
        run: |
          npm run start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "started server, pid=$(cat /tmp/server.pid)"

      - name: Wait for server on :5000
        run: |
          # Tail the log in the background so any crash is visible immediately,
          # not only after the full 60 s wait exhausts.
          tail -f /tmp/server.log &
          TAIL_PID=$!

          for i in {1..30}; do
            # GET /api/tenant is a public endpoint that always returns 200 JSON.
            # Avoids the previous OPTIONS /api/portal/login which returned 404
            # (POST-only route) causing curl -f to fail even when the server
            # was fully up.
            if curl -fsS -o /dev/null "http://localhost:5000/api/tenant" 2>/dev/null; then
              echo "server is up (attempt $i)"
              kill "$TAIL_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done

          kill "$TAIL_PID" 2>/dev/null || true
          echo "::error::server did not come up within 60s"
          echo "===== /tmp/server.log (full) ====="
          cat /tmp/server.log || true
          exit 1

      # Seed once up front so each e2e can run with SKIP_SEED=1 and we don't
      # pay for the (idempotent) seed script per test file.
      - name: Seed beta demo org
        run: npx tsx scripts/seed-beta-org.ts

      # Discover and run every tests/portal-*.e2e.ts file against the same
      # already-running server. Any single failure fails the whole job.
      - name: Run all portal e2e tests
        env:
          SKIP_SEED: '1'
        run: |
          shopt -s nullglob
          files=(tests/portal-*.e2e.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tests/portal-*.e2e.ts files found"
            exit 1
          fi
          echo "Discovered ${#files[@]} portal e2e file(s):"
          printf '  %s\n' "${files[@]}"
          failed=()
          for f in "${files[@]}"; do
            echo ""
            echo "===== Running $f ====="
            if ! npx tsx "$f"; then
              echo "::error file=$f::portal e2e failed"
              failed+=("$f")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "::error::${#failed[@]} portal e2e file(s) failed:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== /tmp/server.log (tail) ====="
          tail -n 500 /tmp/server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi
